<article class="stat-card">

  <div class="stat-content">

    <span class="stat-label">
      {{ label() }}
    </span>

    <strong class="stat-value">
      {{ value() }}
    </strong>

    @if (description()) {
      <span class="stat-description">
        {{ description() }}
      </span>
    }

  </div>

</article>
