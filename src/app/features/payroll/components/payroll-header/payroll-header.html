<header class="payroll-header">
  <div class="header-content">

    <div class="header-info">
      <span class="eyebrow">Finance & Payroll</span>

      <h1>Payroll Management</h1>

      <p>
        Manage employee payroll, salary processing,
        allowances, deductions, and payment confirmations.
      </p>
    </div>

    <button
      type="button"
      class="primary-button"
      (click)="generatePayroll.emit()"
    >
      <span class="button-icon">+</span>
      Generate Payroll
    </button>

  </div>
</header>
