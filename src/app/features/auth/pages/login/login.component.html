<div class="login-page">

  <section class="login-branding">

    <div class="branding-content">

      <div class="branding-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M9 3v18"></path>
          <path d="M15 3v18"></path>
          <path d="M3 9h6"></path>
          <path d="M15 9h6"></path>
          <path d="M3 15h6"></path>
          <path d="M15 15h6"></path>
        </svg>
      </div>

      <h1>EMAS</h1>

      <p class="branding-title">
        Employee Management &amp; Approval System
      </p>

      <p class="branding-description">
        Streamline employee management, hiring, onboarding,
        approvals, tasks, and organizational workflows in one
        centralized platform.
      </p>

    </div>

  </section>


  <section class="login-content">

    <div class="login-form-container">

      <div class="mobile-branding">

        <div class="mobile-branding-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M9 3v18"></path>
            <path d="M15 3v18"></path>
            <path d="M3 9h6"></path>
            <path d="M15 9h6"></path>
            <path d="M3 15h6"></path>
            <path d="M15 15h6"></path>
          </svg>
        </div>

        <h1>EMAS</h1>

      </div>


      <div class="login-header">

        <h2>Welcome back</h2>

        <p>
          Sign in to your account to continue.
        </p>

      </div>


      @if (errorMessage()) {

        <div
          class="login-error"
          role="alert"
          aria-live="polite"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="10"
            ></circle>

            <line
              x1="12"
              y1="8"
              x2="12"
              y2="12"
            ></line>

            <line
              x1="12"
              y1="16"
              x2="12.01"
              y2="16"
            ></line>
          </svg>

          <span>
            {{ errorMessage() }}
          </span>

        </div>

      }


      <form
        class="login-form"
        (ngSubmit)="onSubmit()"
        #loginForm="ngForm"
      >

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <div class="input-wrapper">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              ></rect>

              <polyline points="3,7 12,13 21,7"></polyline>
            </svg>

            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="loginRequest.email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />

          </div>

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="11"
                width="18"
                height="10"
                rx="2"
              ></rect>

              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>

            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="loginRequest.password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="
                showPassword
                  ? 'Hide password'
                  : 'Show password'
              "
            >

              @if (showPassword) {

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                  ></circle>

                  <line
                    x1="4"
                    y1="4"
                    x2="20"
                    y2="20"
                  ></line>
                </svg>

              } @else {

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>

                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                  ></circle>
                </svg>

              }

            </button>

          </div>

        </div>


        <div class="login-options">

          <label class="remember-me">

            <input
              type="checkbox"
              name="rememberMe"
              [(ngModel)]="rememberMe"
            />

            <span class="checkbox-label">
              Remember me
            </span>

          </label>

          <a
            routerLink="/forgot-password"
            class="forgot-password"
          >
            Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="login-button"
          [disabled]="isLoading() || loginForm.invalid"
        >

          @if (isLoading()) {

            <span class="loading-content">

              <span
                class="spinner"
                aria-hidden="true"
              ></span>

              <span>
                Signing in...
              </span>

            </span>

          } @else {

            <span>
              Sign In
            </span>

          }

        </button>

      </form>


    </div>

  </section>

</div>
