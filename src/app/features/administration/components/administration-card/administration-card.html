<a
  class="administration-card"
  [routerLink]="route">

  <div class="card-top">
    <div class="card-icon" aria-hidden="true">
      {{ icon }}
    </div>

    <span class="card-action">
      {{ actionLabel }} →
    </span>
  </div>

  <div class="card-content">
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
  </div>

</a>
